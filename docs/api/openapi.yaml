{
  "openapi": "3.1.0",
  "info": {
    "title": "Route Engine Durable Execution and Recovery API",
    "version": "0.5.0",
    "description": "Implemented registry/version APIs, DB admission, durable execution, configured REST/Kubernetes/Ansible adapters, and audited operator recovery. Caller/operator/admin bearer hash roles are enforced. Admin retains local-admin identity. Caller may submit/read its own executions, operator may inspect/recover/cancel/resolve any execution, admin also manages routes/config. Admission decision lookups remain principal-scoped. Missing auth refuses startup; forbidden role is403. Health GET probes are unauthenticated; metrics require operator/admin. Production/external acceptance is NOT_RUN and deployment is not authorized. Strict JSON token types, unknown fields and trailing roots reject with 422 before mutation. Unsupported Content-Type is 415, incompatible Accept is JSON 406 before mutation. All errors include UTC timestamp and requestId; optional X-Request-ID is 1-128 A-Z a-z 0-9 . _ : - characters. Admission and recovery Idempotency-Key is principal plus endpoint/execution scoped; replay returns the original immutable decision. QUEUE and NOW_OR_REJECT use the same CRITICAL/FIFO/WRR scheduler and immutable priority/version. NOW means a permit acquired in the transaction, not immediate external work. 409 ADMISSION_REJECTED differs from 503 unknown database outcome: retain the same key on uncertainty. Development simulation and crash hooks require the explicit engine-development profile. Real adapters use controlled immutable catalog bindings; external I/O is outside DB transactions."
  },
