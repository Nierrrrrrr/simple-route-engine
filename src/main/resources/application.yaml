spring:
  application:
    name: route-engine
  datasource:
    url: ${ROUTE_DB_URL}
    username: ${ROUTE_DB_USER}
    password: ${ROUTE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
      validation-timeout: 1000
      connection-init-sql: "SET time_zone = '+00:00', innodb_lock_wait_timeout=3"
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false
  flyway:
    clean-disabled: true
server:
  address: ${ROUTE_BIND_ADDRESS:127.0.0.1}
  port: ${ROUTE_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
route:
  auth:
    admin-token-sha256: ${ROUTE_ADMIN_TOKEN_SHA256:}
    caller-token-sha256: ${ROUTE_CALLER_TOKEN_SHA256:}
    operator-token-sha256: ${ROUTE_OPERATOR_TOKEN_SHA256:}
logging:
  level:
    org.springframework.web: WARN

  file:
    name: ${ROUTE_LOG_FILE:./.local/logs/route-engine.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
